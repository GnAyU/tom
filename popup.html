<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 260px; margin: 0; padding: 14px 16px; color: #202124;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #5f6368; margin-bottom: 12px; }
    .count { font-size: 28px; font-weight: 700; }
    .count-label { font-size: 12px; color: #5f6368; margin-bottom: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute; inset: 0; border-radius: 22px;
      background: #dadce0; transition: .15s; cursor: pointer;
    }
    .track:before {
      content: ""; position: absolute; width: 18px; height: 18px;
      left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .15s;
    }
    input:checked + .track { background: #1a73e8; }
    input:checked + .track:before { transform: translateX(18px); }
    .state { font-size: 13px; }
    .stats { display: flex; gap: 24px; }
    #siteToggle { width: 100%; margin-top: 14px; padding: 8px; cursor: pointer; }
    #siteHint { margin: 6px 0 0; font-size: 12px; color: #5f6368; }
  </style>
</head>
<body>
  <h1>Orochi AdBlock</h1>
  <div class="sub">EasyList · EasyList China · EasyPrivacy</div>
  <div class="stats">
    <div>
      <div class="count" id="count">–</div>
      <div class="count-label">本页已拦截</div>
    </div>
    <div>
      <div class="count" id="totalBlocked">–</div>
      <div class="count-label">累计已拦截</div>
    </div>
  </div>
  <div class="row">
    <span class="state" id="stateText">拦截中</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="track"></span>
    </label>
  </div>
  <button id="siteToggle" type="button" disabled>暂停此站点拦截</button>
  <p id="siteHint" role="status">刷新页面后元素隐藏设置生效</p>
  <script src="popup.js"></script>
</body>
</html>
